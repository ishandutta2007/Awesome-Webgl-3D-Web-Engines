<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>

    <!-- Glowing Title Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Wireframe Stroke Gradient -->
    <linearGradient id="wireGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowMagenta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#be185d" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Isometric Grid Pattern -->
    <pattern id="isoGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1" />
      <circle cx="0" cy="0" r="1.5" fill="rgba(255, 255, 255, 0.15)" />
    </pattern>

    <!-- Card Drop Shadow Filter -->
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#6366f1" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="pillGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>
  </defs>

  <style>
    @keyframes pulseDash {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseDashReverse {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 120; }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-14px) scale(1.1); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(14px) scale(0.92); }
    }
    @keyframes rotateWireframe {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes vertexBreathe {
      0%, 100% { r: 4px; opacity: 0.7; }
      50% { r: 7px; opacity: 1; }
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: pulseDash 3s linear infinite;
    }
    .flow-line-rev {
      stroke-dasharray: 8 6;
      animation: pulseDashReverse 4s linear infinite;
    }
    .orb-float-1 {
      animation: floatOrb1 7s ease-in-out infinite;
    }
    .orb-float-2 {
      animation: floatOrb2 8s ease-in-out infinite;
    }
    .vertex-pulse {
      animation: vertexBreathe 3s ease-in-out infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
    }
    .mono-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 600;
      font-size: 11px;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />
  <rect width="1200" height="360" rx="16" fill="url(#isoGrid)" />

  <!-- Ambient Glowing Background Elements -->
  <circle class="orb-float-1" cx="180" cy="90" r="150" fill="url(#glowCyan)" opacity="0.3" />
  <circle class="orb-float-2" cx="1040" cy="270" r="160" fill="url(#glowPurple)" opacity="0.35" />
  <circle class="orb-float-1" cx="950" cy="80" r="130" fill="url(#glowMagenta)" opacity="0.25" />
  <circle class="orb-float-2" cx="120" cy="280" r="120" fill="url(#glowEmerald)" opacity="0.2" />

  <!-- Left Side: 3D Wireframe Polyhedron / Mesh Visual -->
  <g transform="translate(130, 180)" opacity="0.55">
    <!-- Isometric Cube / Wireframe Nodes -->
    <path class="flow-line" d="M 0 -70 L 60 -35 L 60 35 L 0 70 L -60 35 L -60 -35 Z" fill="none" stroke="url(#wireGradient)" stroke-width="2" />
    <path class="flow-line-rev" d="M 0 -70 L 0 0 L 60 35 M 0 0 L -60 35" fill="none" stroke="url(#wireGradient)" stroke-width="2" />
    <line x1="0" y1="0" x2="0" y2="70" stroke="url(#wireGradient)" stroke-width="2" stroke-dasharray="4 4" />
    <!-- Vertex Nodes -->
    <circle cx="0" cy="-70" r="5" fill="#38bdf8" class="vertex-pulse" />
    <circle cx="60" cy="-35" r="5" fill="#818cf8" class="vertex-pulse" />
    <circle cx="60" cy="35" r="5" fill="#c084fc" class="vertex-pulse" />
    <circle cx="0" cy="70" r="5" fill="#f43f5e" class="vertex-pulse" />
    <circle cx="-60" cy="35" r="5" fill="#38bdf8" class="vertex-pulse" />
    <circle cx="-60" cy="-35" r="5" fill="#818cf8" class="vertex-pulse" />
    <circle cx="0" cy="0" r="6" fill="#ec4899" class="vertex-pulse" />
  </g>

  <!-- Right Side: 3D Web Coordinates & Shading Tessellation -->
  <g transform="translate(1070, 180)" opacity="0.55">
    <!-- Orbit Rings -->
    <ellipse cx="0" cy="0" rx="75" ry="35" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6 4" transform="rotate(-25)" class="flow-line" />
    <ellipse cx="0" cy="0" rx="75" ry="35" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" transform="rotate(45)" class="flow-line-rev" />
    <circle cx="0" cy="0" r="28" fill="rgba(192, 132, 252, 0.15)" stroke="#c084fc" stroke-width="2" />
    <!-- Orbiting Photons / Satellites -->
    <circle cx="50" cy="-25" r="5" fill="#38bdf8" class="vertex-pulse" />
    <circle cx="-45" cy="30" r="5" fill="#f43f5e" class="vertex-pulse" />
  </g>

  <!-- Dynamic Floating Tech Pills (Outer Edges) -->
  <g filter="url(#pillGlow)" opacity="0.85">
    <!-- Pill 1: Top Left -->
    <rect x="50" y="35" width="145" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="66" cy="49" r="4" fill="#38bdf8" />
    <text x="78" y="53" fill="#cbd5e1" class="mono-pill">WebGL 2.0 / WebGPU</text>

    <!-- Pill 2: Bottom Left -->
    <rect x="50" y="295" width="145" height="28" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
    <circle cx="66" cy="309" r="4" fill="#10b981" />
    <text x="78" y="313" fill="#cbd5e1" class="mono-pill">Real-Time PBR 3D</text>

    <!-- Pill 3: Top Right -->
    <rect x="1005" y="35" width="145" height="28" rx="14" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" />
    <circle cx="1021" cy="49" r="4" fill="#c084fc" />
    <text x="1033" y="53" fill="#cbd5e1" class="mono-pill">Three.js &amp; Babylon</text>

    <!-- Pill 4: Bottom Right -->
    <rect x="1005" y="295" width="145" height="28" rx="14" fill="#0f172a" stroke="#f43f5e" stroke-width="1.2" />
    <circle cx="1021" cy="309" r="4" fill="#f43f5e" />
    <text x="1033" y="313" fill="#cbd5e1" class="mono-pill">Spatial WebXR / AR</text>
  </g>

  <!-- Foreground Glassmorphic Center Card (Keeps Title & Subtitle Completely Clear) -->
  <g filter="url(#cardGlow)">
    <rect x="225" y="60" width="750" height="240" rx="20" fill="rgba(11, 18, 36, 0.88)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
  </g>

  <!-- 3D Graphic Icon Header in Center Card -->
  <g transform="translate(600, 108)">
    <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
    <!-- 3D Box Wireframe Icon -->
    <path d="M 0 -11 L 10 -5 L 10 6 L 0 12 L -10 6 L -10 -5 Z" fill="none" stroke="#38bdf8" stroke-width="1.8" />
    <path d="M 0 -11 L 0 12 M -10 -5 L 0 0 L 10 -5" fill="none" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="0" cy="0" r="2.5" fill="#f43f5e" />
  </g>

  <!-- Main Title -->
  <text x="600" y="172" text-anchor="middle" fill="url(#titleGradient)" class="title-text" font-size="38" letter-spacing="-0.5">
    Awesome WebGL &amp; 3D Web Engines
  </text>

  <!-- Subtitle -->
  <text x="600" y="214" text-anchor="middle" fill="#e2e8f0" class="sub-text" font-size="16" letter-spacing="0.2">
    The Curated Directory of WebGL/WebGPU Engines, Runtimes &amp; 3D Graphics Frameworks
  </text>

  <!-- Feature Tags Row -->
  <g transform="translate(600, 256)">
    <text text-anchor="middle" fill="#94a3b8" class="mono-pill" font-size="12">
      ⚡ Three.js • Babylon.js • React Three Fiber • PlayCanvas • CesiumJS • WebGPU • glTF
    </text>
  </g>
</svg>
