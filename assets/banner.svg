<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#060913"/><stop offset="50%" stop-color="#0d1527"/><stop offset="100%" stop-color="#04060d"/></linearGradient><linearGradient id="titleGradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="30%" stop-color="#818cf8"/><stop offset="70%" stop-color="#c084fc"/><stop offset="100%" stop-color="#f43f5e"/></linearGradient><linearGradient id="wireGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="50%" stop-color="#a855f7" stop-opacity=".9"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".8"/></linearGradient><radialGradient id="glowCyan" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".6"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient><radialGradient id="glowPurple" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#c084fc" stop-opacity=".6"/><stop offset="100%" stop-color="#7e22ce" stop-opacity="0"/></radialGradient><radialGradient id="glowMagenta" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#f43f5e" stop-opacity=".5"/><stop offset="100%" stop-color="#be185d" stop-opacity="0"/></radialGradient><radialGradient id="glowEmerald" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#10b981" stop-opacity=".5"/><stop offset="100%" stop-color="#059669" stop-opacity="0"/></radialGradient><pattern id="isoGrid" width="60" height="60" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1" d="M 60 0 L 0 0 0 60"/><circle cx="0" cy="0" r="1.5" fill="rgba(255, 255, 255, 0.15)"/></pattern><filter id="cardGlow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="12" flood-color="#6366f1" flood-opacity=".25" stdDeviation="20"/><feDropShadow dx="0" dy="2" flood-color="#000" flood-opacity=".6" stdDeviation="6"/></filter><filter id="pillGlow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="3" flood-color="#38bdf8" flood-opacity=".3" stdDeviation="6"/></filter></defs><style>@keyframes pulseDash{0%{stroke-dashoffset:120}}@keyframes pulseDashReverse{0%{stroke-dashoffset:0}}@keyframes floatOrb1{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-14px) scale(1.1)}}@keyframes floatOrb2{0%{transform:translateY(0) scale(1)}50%{transform:translateY(14px) scale(.92)}}@keyframes rotateWireframe{0%{transform:rotate(0deg)}}@keyframes vertexBreathe{0%{r:4px;opacity:.7}50%{r:7px;opacity:1}}.flow-line,.flow-line-rev{stroke-dasharray:8 6;animation:pulseDash 3s linear infinite}.flow-line-rev{animation:pulseDashReverse 4s linear infinite}.orb-float-1{animation:floatOrb1 7s ease-in-out infinite}.orb-float-2{animation:floatOrb2 8s ease-in-out infinite}.vertex-pulse{animation:vertexBreathe 3s ease-in-out infinite}.sub-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,&apos;Helvetica Neue&apos;,Arial,sans-serif}.title-text{font-weight:800}.sub-text{font-weight:500}.mono-pill{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-weight:600;font-size:11px}</style><rect width="1200" height="360" fill="url(#bgGradient)" rx="16"/><rect width="1200" height="360" fill="url(#isoGrid)" rx="16"/><circle cx="180" cy="90" r="150" fill="url(#glowCyan)" class="orb-float-1" opacity=".3"/><circle cx="1040" cy="270" r="160" fill="url(#glowPurple)" class="orb-float-2" opacity=".35"/><circle cx="950" cy="80" r="130" fill="url(#glowMagenta)" class="orb-float-1" opacity=".25"/><circle cx="120" cy="280" r="120" fill="url(#glowEmerald)" class="orb-float-2" opacity=".2"/><g opacity=".55" transform="translate(130, 180)"><path fill="none" stroke="url(#wireGradient)" stroke-width="2" d="M 0 -70 L 60 -35 L 60 35 L 0 70 L -60 35 L -60 -35 Z" class="flow-line"/><path fill="none" stroke="url(#wireGradient)" stroke-width="2" d="M 0 -70 L 0 0 L 60 35 M 0 0 L -60 35" class="flow-line-rev"/><line x1="0" x2="0" y1="0" y2="70" stroke="url(#wireGradient)" stroke-dasharray="4 4" stroke-width="2"/><circle cx="0" cy="-70" r="5" fill="#38bdf8" class="vertex-pulse"/><circle cx="60" cy="-35" r="5" fill="#818cf8" class="vertex-pulse"/><circle cx="60" cy="35" r="5" fill="#c084fc" class="vertex-pulse"/><circle cx="0" cy="70" r="5" fill="#f43f5e" class="vertex-pulse"/><circle cx="-60" cy="35" r="5" fill="#38bdf8" class="vertex-pulse"/><circle cx="-60" cy="-35" r="5" fill="#818cf8" class="vertex-pulse"/><circle cx="0" cy="0" r="6" fill="#ec4899" class="vertex-pulse"/></g><g opacity=".55" transform="translate(1070, 180)"><ellipse cx="0" cy="0" fill="none" stroke="#818cf8" stroke-dasharray="6 4" stroke-width="1.5" class="flow-line" rx="75" ry="35" transform="rotate(-25)"/><ellipse cx="0" cy="0" fill="none" stroke="#38bdf8" stroke-dasharray="6 4" stroke-width="1.5" class="flow-line-rev" rx="75" ry="35" transform="rotate(45)"/><circle cx="0" cy="0" r="28" fill="rgba(192, 132, 252, 0.15)" stroke="#c084fc" stroke-width="2"/><circle cx="50" cy="-25" r="5" fill="#38bdf8" class="vertex-pulse"/><circle cx="-45" cy="30" r="5" fill="#f43f5e" class="vertex-pulse"/></g><g filter="url(#pillGlow)" opacity=".85"><rect width="145" height="28" x="50" y="35" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" rx="14"/><circle cx="66" cy="49" r="4" fill="#38bdf8"/><text x="78" y="53" fill="#cbd5e1" class="mono-pill">WebGL 2.0 / WebGPU</text><rect width="145" height="28" x="50" y="295" fill="#0f172a" stroke="#10b981" stroke-width="1.2" rx="14"/><circle cx="66" cy="309" r="4" fill="#10b981"/><text x="78" y="313" fill="#cbd5e1" class="mono-pill">Real-Time PBR 3D</text><rect width="145" height="28" x="1005" y="35" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" rx="14"/><circle cx="1021" cy="49" r="4" fill="#c084fc"/><text x="1033" y="53" fill="#cbd5e1" class="mono-pill">Three.js &amp; Babylon</text><rect width="145" height="28" x="1005" y="295" fill="#0f172a" stroke="#f43f5e" stroke-width="1.2" rx="14"/><circle cx="1021" cy="309" r="4" fill="#f43f5e"/><text x="1033" y="313" fill="#cbd5e1" class="mono-pill">Spatial WebXR / AR</text></g><g filter="url(#cardGlow)"><rect width="750" height="240" x="225" y="60" fill="rgba(11, 18, 36, 0.88)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" rx="20"/></g><g transform="translate(600, 108)"><circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#6366f1" stroke-width="2"/><path fill="none" stroke="#38bdf8" stroke-width="1.8" d="M 0 -11 L 10 -5 L 10 6 L 0 12 L -10 6 L -10 -5 Z"/><path fill="none" stroke="#c084fc" stroke-width="1.5" d="M 0 -11 L 0 12 M -10 -5 L 0 0 L 10 -5"/><circle cx="0" cy="0" r="2.5" fill="#f43f5e"/></g><text x="600" y="172" fill="url(#titleGradient)" class="title-text" font-size="38" letter-spacing="-.5" text-anchor="middle">Awesome WebGL &amp; 3D Web Engines</text><text x="600" y="214" fill="#e2e8f0" class="sub-text" font-size="16" letter-spacing=".2" text-anchor="middle">The Curated Directory of WebGL/WebGPU Engines, Runtimes &amp; 3D Graphics Frameworks</text><g><text fill="#94a3b8" class="mono-pill" font-size="12" text-anchor="middle" transform="translate(600, 256)">⚡ Three.js • Babylon.js • React Three Fiber • PlayCanvas • CesiumJS • WebGPU • glTF</text></g></svg>